<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172833" />
    <meta name="description" content="Luftfartsfag Studentportal — training and daily student operations." />
    <link rel="icon" href="/icons/portal.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Studentportal" />
    <title>Luftfartsfag Studentportal</title>
    <script>
      // Apply the saved theme before first paint; src/app/theme.ts owns it after load.
      (function () {
        var preference = null;
        try { preference = localStorage.getItem('portal-theme'); } catch (error) {}
        var dark = preference === 'dark' || (preference !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b161c' : '#172833');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
