name: Release Studentportal
run-name: Release ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches: [develop, redesign, master]
  workflow_dispatch:

permissions:
  contents: read

# Same group as database-only recovery. Never interrupt an active migration.
concurrency:
  group: studentportal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      branch: ${{ steps.plan.outputs.branch }}
      target: ${{ steps.plan.outputs.target }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enforce branch mapping and enable controls
        id: plan
        env:
          AUTO_RELEASE_PREVIEW: ${{ vars.AUTO_RELEASE_PREVIEW }}
          AUTO_RELEASE_PRODUCTION: ${{ vars.AUTO_RELEASE_PRODUCTION }}
        run: node scripts/release-target.mjs

  release:
    name: Validate, migrate and deploy
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        id: install
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Validate and test exact revision
        id: tests
        run: |
          npm run check
          npm test
          npm --prefix frontend test
      - name: Build frontend and Pages Functions
        id: build
        env:
          PAGES_ENVIRONMENT: ${{ needs.plan.outputs.target }}
        run: |
          npm run build
          npm run functions:build
          node scripts/release-tools.mjs prepare
          node -e "console.log('wrangler_version=' + require('./node_modules/wrangler/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: List, migrate and verify target D1
        id: migrate
        env:
          CI: 'true'
          AUTO_RELEASE_PREVIEW: ${{ vars.AUTO_RELEASE_PREVIEW }}
          AUTO_RELEASE_PRODUCTION: ${{ vars.AUTO_RELEASE_PRODUCTION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-tools.mjs migrate
      - name: Deploy the already-built revision with Functions
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: ${{ steps.build.outputs.wrangler_version }}
          command: pages deploy frontend/dist --project-name availogger --branch ${{ needs.plan.outputs.branch }} --commit-hash ${{ github.sha }} --commit-dirty=false --no-bundle
      - name: Release summary
        if: always()
        env:
          RELEASE_TARGET: ${{ needs.plan.outputs.target }}
          INSTALL_STATUS: ${{ steps.install.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          MIGRATE_STATUS: ${{ steps.migrate.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## $RELEASE_TARGET release"
            echo "Revision: $GITHUB_SHA ($GITHUB_REF)"
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Install | $INSTALL_STATUS |"
            echo "| Tests/type checks | $TEST_STATUS |"
            echo "| Frontend + Functions build | $BUILD_STATUS |"
            echo "| D1 migration + no pending verification | $MIGRATE_STATUS |"
            echo "| Pages deployment | $DEPLOY_STATUS |"
            echo "Deployment: $DEPLOY_URL"
            echo "If migration failed, deployment was skipped; inspect migration logs for the failing SQL file."
            echo "If deployment failed after migration, schema remains applied. Fix the deployment and rerun; D1 is not automatically rolled back."
          } >> "$GITHUB_STEP_SUMMARY"
