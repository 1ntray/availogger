name: Update database
run-name: Update ${{ inputs.target }} database using ${{ inputs.migrations_branch }} migrations

# Explicit manual action only. PR checks continue using disposable local D1.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Database to update
        required: true
        type: choice
        default: preview
        options: [preview, production]
      migrations_branch:
        description: Reviewed branch containing the migrations
        required: true
        type: choice
        default: develop
        options: [develop, master]

permissions:
  contents: read

concurrency:
  group: d1-migrations-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate target and pin migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate manual selection
        env:
          DB_TARGET: ${{ inputs.target }}
          MIGRATIONS_BRANCH: ${{ inputs.migrations_branch }}
          WORKFLOW_REF: ${{ github.ref }}
        run: node scripts/check-database-update.mjs
      - name: Resolve reviewed migration source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.migrations_branch }}
          path: migrations-source
      - name: Record migration revision
        id: revision
        working-directory: migrations-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  migrate:
    name: Apply ${{ inputs.target }} migrations
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set up these environments and their secrets before the first manual run.
    environment: database-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.migrations_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: List, apply and verify pending migrations
        env:
          CI: 'true'
          DB_TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the selected GitHub database environment."
            exit 1
          fi
          npm run "db:status:$DB_TARGET"
          npm run "db:migrate:$DB_TARGET"
          npm run "db:status:$DB_TARGET"
      - name: Record successful update
        env:
          DB_TARGET: ${{ inputs.target }}
          MIGRATIONS_SHA: ${{ needs.validate.outputs.migrations_sha }}
        run: |
          echo "Updated $DB_TARGET database from commit $MIGRATIONS_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Review the final migration list in the logs. Pages deployment is a separate operation." >> "$GITHUB_STEP_SUMMARY"
